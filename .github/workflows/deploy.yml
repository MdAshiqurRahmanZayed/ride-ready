name: Deploy Backend to EC2

# BACKEND DEPLOYMENT PIPELINE
# 
# Triggers when:
#   - Push to main branch with changes in backend/ or terraform/
#   - Manual trigger via GitHub Actions UI
#
# What it does:
#   1. SSHs to EC2 server
#   2. Pulls latest code from main branch
#   3. Rebuilds Docker containers with new code
#   4. Runs database migrations automatically
#   5. Collects static files to S3
#   6. Starts backend with Gunicorn (3 workers)
#
# Result: 
#   Backend API updated at http://backend-ip:9000
#   Running with Gunicorn WSGI server (3 workers for production)
#
# Note: Frontend is NOT affected by this pipeline
#       Frontend has its own pipeline (deploy-frontend.yml)

on:
  push:
    branches: [ main ]
    paths:
      - 'backend/**'        # Trigger on backend changes
      - 'terraform/**'      # Or infrastructure changes
  workflow_dispatch:        # Allow manual trigger

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Deploy to EC2
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          cd ~/ride-ready
          ./deploy.sh
