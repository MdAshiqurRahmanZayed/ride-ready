name: Deploy Backend to EC2

# BACKEND DEPLOYMENT PIPELINE
# 
# Triggers when:
#   - Push to main branch with changes in backend/ or terraform/
#   - Manual trigger via GitHub Actions UI
#
# What it does:
#   1. SSHs to EC2 server
#   2. Pulls latest code
#   3. Rebuilds Docker containers
#   4. Runs database migrations
#   5. Collects static files
#
# Result: 
#   Backend API updated at http://backend-ip:9000
#
# Note: Frontend is NOT affected by this pipeline
#       Frontend has its own pipeline (deploy-frontend.yml)

on:
  push:
    branches: [ main ]
    paths:
      - 'backend/**'        # Trigger on backend changes
      - 'terraform/**'      # Or infrastructure changes
  workflow_dispatch:        # Allow manual trigger

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Deploy to EC2
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          cd ~/ride-ready/backend/RideReady
          git pull origin main
          sudo docker compose down
          sudo docker compose up -d --build
          sudo docker compose exec backend python manage.py migrate
          sudo docker compose exec backend python manage.py collectstatic --noinput
