name: Deploy Frontend to S3

# FRONTEND DEPLOYMENT PIPELINE
# 
# Triggers when:
#   - Push to main branch with changes in frontend/ directory
#   - Manual trigger via GitHub Actions UI
#
# What it does:
#   1. Builds React application
#   2. Uploads to S3 bucket
#   3. Updates website content
#
# Result: 
#   Frontend accessible at S3 website URL
#
# Note: Backend is NOT affected by this pipeline
#       Backend has its own pipeline (deploy.yml)

on:
  push:
    branches: [ main ]
    paths:
      - 'frontend/**'      # Only trigger on frontend changes
  workflow_dispatch:        # Allow manual trigger

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: frontend
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '24'
        cache: 'npm'
        cache-dependency-path: 'frontend/package-lock.json'

    - name: Install dependencies
      run: npm ci

    - name: Create .env file
      run: |
        echo "REACT_APP_BACKEND_URL=${{ secrets.BACKEND_URL }}" > .env

    - name: Build
      run: npm run build

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: eu-central-1

    - name: Deploy to S3
      run: |
        aws s3 sync build/ s3://${{ secrets.S3_BUCKET_NAME }} --delete
