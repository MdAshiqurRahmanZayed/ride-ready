version: '3.8'

services:
  db:
    image: postgres:15
    container_name: rideready_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${DB_NAME:-rideready_db}
      POSTGRES_USER: ${DB_USER:-rideready}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-rideready_password}
    restart: always

  backend:
    build: .
    container_name: rideready_backend
    volumes:
      - ./media:/app/media
      - ./static:/app/static
    env_file:
      - .env
    depends_on:
      - db
    restart: always

  nginx:
    image: nginx:alpine
    container_name: rideready_nginx
    ports:
      - "9000:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./static:/app/static:ro
      - ./media:/app/media:ro
    depends_on:
      - backend
    restart: always

volumes:
  postgres_data:
