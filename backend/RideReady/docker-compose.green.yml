# Green Environment - Staging/New Version (Port 9001)
# This is the new version being deployed for testing before switching

services:
  db:
    image: postgres:15
    container_name: rideready_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${DB_NAME:-rideready_db}
      POSTGRES_USER: ${DB_USER:-rideready}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-rideready_password}
    ports:
      - "5432:5432"
    restart: unless-stopped
    networks:
      - rideready-network

  backend:
    build: .
    container_name: rideready_backend_green
    volumes:
      - ./media:/app/media
      - ./static:/app/static
    ports:
      - "9001:8000"
    env_file:
      - .env
    environment:
      - DEPLOYMENT_ENV=green
    depends_on:
      - db
    restart: unless-stopped
    networks:
      - rideready-network
    labels:
      - "deployment=green"
      - "version=staging"

volumes:
  postgres_data:
    external: true

networks:
  rideready-network:
    external: true
