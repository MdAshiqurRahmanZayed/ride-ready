services:
  db:
    image: postgres:15
    container_name: rideready_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${DB_NAME:-rideready_db}
      POSTGRES_USER: ${DB_USER:-rideready}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-rideready_password}
    ports:
      - "5432:5432"
    restart: unless-stopped

  backend:
    build: .
    container_name: rideready_backend
    volumes:
      - ./media:/app/media
      - ./static:/app/static
    ports:
      - "9000:8000"
    env_file:
      - .env
    depends_on:
      - db
    restart: unless-stopped

volumes:
  postgres_data:
