# Nginx Configuration for Blue-Green Deployment
# Place this in /etc/nginx/sites-available/rideready

upstream backend_blue {
    server localhost:9000;
}

upstream backend_green {
    server localhost:9001;
}

# Active backend (change this to switch between blue and green)
upstream backend_active {
    server localhost:9000;  # Change to 9001 for green
}

server {
    listen 80;
    server_name 63.183.7.127;  # Your EC2 IP

    client_max_body_size 100M;

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # Blue environment endpoint (for testing)
    location /blue/ {
        proxy_pass http://backend_blue/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Green environment endpoint (for testing)
    location /green/ {
        proxy_pass http://backend_green/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Main traffic goes to active environment
    location / {
        proxy_pass http://backend_active;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Static files (from S3)
    location /static/ {
        proxy_pass https://zayed-ride-ready-dev-media.s3.eu-central-1.amazonaws.com/static/;
        expires 30d;
    }

    # Media files (from S3)
    location /media/ {
        proxy_pass https://zayed-ride-ready-dev-media.s3.eu-central-1.amazonaws.com/media/;
        expires 30d;
    }
}
