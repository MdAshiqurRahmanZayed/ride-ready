# Nginx Configuration for Blue-Green Deployment
# Place this in /etc/nginx/sites-available/rideready
# Enable: sudo ln -s /etc/nginx/sites-available/rideready /etc/nginx/sites-enabled/

# Active backend (automatically updated by deploy.sh)
upstream backend_active {
    server localhost:9000;  # Updated automatically by deploy.sh
}

server {
    listen 80;
    server_name 63.183.7.127;  # Your EC2 IP or domain

    client_max_body_size 100M;

    # Main traffic goes to active environment
    location / {
        proxy_pass http://backend_active;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Static files (served from S3, but nginx can cache)
    location /static/ {
        proxy_pass https://zayed-ride-ready-dev-media.s3.eu-central-1.amazonaws.com/static/;
        expires 30d;
    }

    # Media files (served from S3)
    location /media/ {
        proxy_pass https://zayed-ride-ready-dev-media.s3.eu-central-1.amazonaws.com/media/;
        expires 30d;
    }
}

