# Nginx Configuration for Blue-Green Deployment
# Place this in /etc/nginx/sites-available/rideready

upstream backend_blue {
    server localhost:9000;
}

upstream backend_green {
    server localhost:9001;
}

# Active backend (change this to switch between blue and green)
upstream backend_active {
    server localhost:9000;  # Change to 9001 for green
}

server {
    listen 80;
    server_name your-domain.com;  # Change to your domain or IP

    client_max_body_size 100M;

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # Blue environment endpoint (for testing)
    location /blue/ {
        proxy_pass http://backend_blue/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Green environment endpoint (for testing)
    location /green/ {
        proxy_pass http://backend_green/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Main traffic goes to active environment
    location / {
        proxy_pass http://backend_active;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Static files
    location /static/ {
        alias /path/to/static/;
        expires 30d;
    }

    # Media files
    location /media/ {
        alias /path/to/media/;
        expires 30d;
    }
}

